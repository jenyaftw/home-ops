# Routed through Authentik's embedded outpost (a Proxy Provider protecting
# flux.jenya.lol - see kubernetes/apps/authentik/authentik/app/blueprint-flux.yaml)
# instead of straight to flux-operator. The outpost checks auth, then
# proxies to flux-operator itself using its own internal_host config.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator-web
  namespace: flux-system
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
  hostnames:
    - flux.jenya.lol
  rules:
    - backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
