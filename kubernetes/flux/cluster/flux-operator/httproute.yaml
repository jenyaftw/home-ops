# Flux Status web UI, read-only by default (no auth configured), LAN-only
# via the internal Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator-web
  namespace: flux-system
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
  hostnames:
    - flux.jenya.lol
  rules:
    - backendRefs:
        - name: flux-operator
          port: 9080
