apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: token
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      # Only ever resolve targets from the external Gateway - the internal
      # Gateway's address is a private LAN IP and must never end up in a
      # public Cloudflare record.
      - --gateway-name=external
      - --gateway-namespace=kube-system
    domainFilters: ["jenya.lol"]
    # Opt-in only: most apps ride the cloudflare-ddns wildcard record
    # instead. Only resources explicitly labeled this way get their own
    # dedicated Cloudflare record.
    labelFilter: external-dns.io/enabled=true
    policy: sync
    registry: txt
    txtOwnerId: serenity
    sources:
      - gateway-httproute
    interval: 1m
    triggerLoopOnEvent: true
