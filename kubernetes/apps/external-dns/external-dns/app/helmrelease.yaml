apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: token
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      # Only ever resolve targets from the external Gateway - the internal
      # Gateway's address is a private LAN IP. The Gateway's own
      # external-dns.kubernetes.io/target annotation overrides this to a
      # CNAME onto jenya.lol (kept in sync with the public IP by
      # cloudflare-ddns), so a private IP never actually ends up published.
      - --gateway-name=external
      - --gateway-namespace=kube-system
      # Cloudflare must proxy these or the CiliumGatewayClassConfig's
      # Cloudflare-only IP allowlist would block real client traffic.
      - --cloudflare-proxied
    domainFilters: ["jenya.lol"]
    # Opt-in only: apps need this label to get their own dedicated
    # Cloudflare record (a CNAME onto jenya.lol - see the external
    # Gateway's target annotation).
    labelFilter: external-dns.io/enabled=true
    policy: sync
    registry: txt
    txtOwnerId: serenity
    sources:
      - gateway-httproute
    interval: 1m
    triggerLoopOnEvent: true
