apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-pihole
  namespace: external-dns
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    provider:
      name: pihole
    env:
      - name: EXTERNAL_DNS_PIHOLE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: pihole-app-password
            key: password
    extraArgs:
      - --pihole-server=http://10.0.10.30
      # Pihole only supports A/AAAA/CNAME - no TXT ownership records possible.
      - --gateway-name=internal
      - --gateway-namespace=kube-system
    registry: noop
    # Never delete records we didn't create - safe if anything is ever
    # added to Pihole by hand.
    policy: upsert-only
    sources:
      - gateway-httproute
    interval: 1m
    triggerLoopOnEvent: true
