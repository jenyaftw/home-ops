apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns-pihole
  namespace: flux-system
spec:
  targetNamespace: external-dns
  path: ./kubernetes/apps/external-dns/external-dns-pihole/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: external-dns
      namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
