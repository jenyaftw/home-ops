apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres
  namespace: flux-system
spec:
  targetNamespace: database
  path: ./kubernetes/apps/database/postgres/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  dependsOn:
    - name: cloudnative-pg
      namespace: flux-system
