---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app decypharr
spec:
  interval: 10m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: decypharr
  install:
    # Don't gate the release on pod readiness: the privileged FUSE mount + init
    # steps can take a moment, and a readiness timeout must not trigger a
    # rollback to a previous (possibly broken) revision.
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  values:
    controllers:
      *app:
        # Recreate so the privileged FUSE mount is fully torn down before a new
        # pod tries to claim it (avoids stale/transport-endpoint mount errors).
        strategy: Recreate
        initContainers:
          init-config:
            image:
              repository: busybox
              tag: 1.37.0
            command:
              - /bin/sh
              - -c
              - test -f /app/config.json || cp /seed/config.json /app/config.json
            securityContext:
              runAsUser: 0
          # Prep the shared host dir for the rclone mount:
          #  - lazily detach any stale FUSE mount left by a previous pod
          #    ("transport endpoint is not connected"), otherwise rclone can't
          #    remount and chown/mkdir would fail.
          #  - chown /mnt to uid 1000 so rclone (PUID 1000) can create its
          #    mountpoint there. hostPath mounts ignore fsGroup, hence explicit.
          # Non-recursive: never touches the FUSE submount contents.
          init-perms:
            image:
              repository: busybox
              tag: 1.37.0
            command:
              - /bin/sh
              - -c
              - umount -l /mnt/remote 2>/dev/null || true; mkdir -p /mnt && chown 1000:1000 /mnt
            securityContext:
              runAsUser: 0
              # privileged required for the Bidirectional shared mount below.
              privileged: true
        containers:
          app:
            # TwistedRat/decypharr reliability fork, built from source by
            # .github/workflows/build-decypharr.yaml (no upstream image exists).
            # Tag is the source commit SHA; re-run the workflow + re-pin to update.
            image:
              repository: ghcr.io/jenyaftw/decypharr
              tag: decypharr-d9dd7ba@sha256:0f34ef186bee7f68ccb045a86b2dfe4455ad79aa78cc8c7326f8eff0cc05662f
            env:
              TZ: Europe/Kyiv
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8282
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
            # Required for the embedded rclone FUSE mount and to publish that
            # mount back to the host so the *arr/Jellyfin pods can read it.
            securityContext:
              privileged: true
              capabilities:
                add:
                  - SYS_ADMIN

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        hostnames: ["decypharr.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      # Decypharr's config.json / auth.json / logs live here.
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: local-path
        globalMounts:
          - path: /app

      # Read-only seed for the init container (copied to /app once).
      config-seed:
        type: configMap
        name: decypharr-config-seed
        globalMounts:
          - path: /seed
            readOnly: true

      # Shared NFS media library. decypharr writes its torrent symlinks under
      # /data/Downloads so the *arr import (download folder -> root folder) stays
      # on the same filesystem as the existing /data/tv, /data/movies libraries.
      media:
        existingClaim: data-pvc
        globalMounts:
          - path: /data

      # FUSE device for rclone. Scoped to the app container only.
      fuse:
        type: hostPath
        hostPath: /dev/fuse
        hostPathType: CharDevice
        advancedMounts:
          decypharr:
            app:
              - path: /dev/fuse

      # Shared host directory. Decypharr mounts the Real-Debrid library here via
      # rclone (/mnt/remote) and writes torrent symlinks (/mnt/symlinks).
      # Bidirectional propagation pushes the FUSE submounts back to the host so
      # Sonarr/Radarr/Jellyfin (mounting the same path HostToContainer) can read
      # the streamed files. Scoped to the privileged app container only -
      # Bidirectional propagation is rejected on non-privileged containers.
      shared:
        type: hostPath
        hostPath: /var/mnt/decypharr
        hostPathType: DirectoryOrCreate
        advancedMounts:
          decypharr:
            app:
              - path: /mnt
                mountPropagation: Bidirectional
            init-perms:
              - path: /mnt
                mountPropagation: Bidirectional
