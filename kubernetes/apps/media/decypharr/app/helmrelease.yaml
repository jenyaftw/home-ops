---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app decypharr
spec:
  interval: 10m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: decypharr
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  values:
    controllers:
      *app:
        # Recreate so the privileged FUSE mount is fully torn down before a new
        # pod tries to claim it (avoids stale/transport-endpoint mount errors).
        strategy: Recreate
        initContainers:
          init-config:
            image:
              repository: busybox
              tag: 1.37.0
            command:
              - /bin/sh
              - -c
              - test -f /app/config.json || cp /seed/config.json /app/config.json
            securityContext:
              runAsUser: 0
        containers:
          app:
            image:
              repository: cy01/blackhole
              tag: v2.3@sha256:94359465fb6337b2ab8168c6abdacf2a8fb60b6b009002ef1bbf3c466823ff31
            env:
              TZ: Europe/Kyiv
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8282
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
            # Required for the embedded rclone FUSE mount and to publish that
            # mount back to the host so the *arr/Jellyfin pods can read it.
            securityContext:
              privileged: true
              capabilities:
                add:
                  - SYS_ADMIN

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        hostnames: ["decypharr.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      # Decypharr's config.json / auth.json / logs live here.
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: local-path
        globalMounts:
          - path: /app

      # Read-only seed for the init container (copied to /app once).
      config-seed:
        type: configMap
        name: decypharr-config-seed
        globalMounts:
          - path: /seed
            readOnly: true

      # FUSE device for rclone. Scoped to the app container only.
      fuse:
        type: hostPath
        hostPath: /dev/fuse
        hostPathType: CharDevice
        advancedMounts:
          decypharr:
            app:
              - path: /dev/fuse

      # Shared host directory. Decypharr mounts the Real-Debrid library here via
      # rclone (/mnt/remote) and writes torrent symlinks (/mnt/symlinks).
      # Bidirectional propagation pushes the FUSE submounts back to the host so
      # Sonarr/Radarr/Jellyfin (mounting the same path HostToContainer) can read
      # the streamed files. Scoped to the privileged app container only -
      # Bidirectional propagation is rejected on non-privileged containers.
      shared:
        type: hostPath
        hostPath: /var/mnt/decypharr
        hostPathType: DirectoryOrCreate
        advancedMounts:
          decypharr:
            app:
              - path: /mnt
                mountPropagation: Bidirectional
