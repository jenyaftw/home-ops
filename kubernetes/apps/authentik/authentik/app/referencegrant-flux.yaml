# Lets the flux-operator-web HTTPRoute (in flux-system) target the
# authentik-server Service here, in authentik's own namespace.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-flux-webui-httproute
  namespace: authentik
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: flux-system
  to:
    - group: ""
      kind: Service
      name: authentik-server
