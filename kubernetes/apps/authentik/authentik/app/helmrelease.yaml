# No Redis: this chart version has dropped it as a dependency entirely
# (verified against the actual chart templates - no references remain).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1h
  releaseName: authentik
  chart:
    spec:
      chart: authentik
      version: "2026.8.x"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: authentik-secrets
      valuesKey: secret_key
      targetPath: authentik.secret_key
    - kind: Secret
      name: authentik-secrets
      valuesKey: postgres_password
      targetPath: authentik.postgresql.password
  values:
    postgresql:
      enabled: false
    authentik:
      postgresql:
        host: postgres-rw.database.svc.cluster.local
        name: authentik
        user: authentik
        port: 5432
    server:
      replicas: 1
    worker:
      replicas: 1
