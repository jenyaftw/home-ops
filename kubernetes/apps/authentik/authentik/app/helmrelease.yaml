# No Redis: this chart version has dropped it as a dependency entirely
# (verified against the actual chart templates - no references remain).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1h
  releaseName: authentik
  chart:
    spec:
      chart: authentik
      version: "2026.8.x"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: authentik-secrets
      valuesKey: secret_key
      targetPath: authentik.secret_key
    - kind: Secret
      name: authentik-secrets
      valuesKey: postgres_password
      targetPath: authentik.postgresql.password
  values:
    postgresql:
      enabled: false
    authentik:
      postgresql:
        host: postgres-rw.database.svc.cluster.local
        name: authentik
        user: authentik
        port: 5432
    blueprints:
      configMaps:
        - authentik-blueprints
    server:
      replicas: 1
      env:
        # Base URL - required so the embedded outpost builds browser-facing
        # redirects (e.g. the OAuth /application/o/authorize/ step) against
        # our real hostname instead of defaulting to localhost.
        - name: AUTHENTIK_HOST
          value: https://authentik.jenya.lol
        - name: AUTHENTIK_BOOTSTRAP_EMAIL
          value: me@jenya.lol
        - name: AUTHENTIK_BOOTSTRAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: bootstrap_password
        - name: AUTHENTIK_BOOTSTRAP_TOKEN
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: bootstrap_token
    worker:
      replicas: 1
      env:
        - name: AUTHENTIK_HOST
          value: https://authentik.jenya.lol
        - name: AUTHENTIK_BOOTSTRAP_EMAIL
          value: me@jenya.lol
        - name: AUTHENTIK_BOOTSTRAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: bootstrap_password
        - name: AUTHENTIK_BOOTSTRAP_TOKEN
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: bootstrap_token
