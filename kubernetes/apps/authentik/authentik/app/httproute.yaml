# Authentik must be reachable wherever public OIDC clients are used.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
  labels:
    external-dns.io/enabled: "true"
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
    - name: external
      namespace: kube-system
  hostnames:
    - authentik.jenya.lol
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
