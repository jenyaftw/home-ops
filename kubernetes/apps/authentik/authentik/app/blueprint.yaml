# Declares Proxy Providers for apps using the embedded outpost, plus the
# Jellyfin application and its existing OIDC provider. Verified identifiers
# against the live database: default flow slugs, and the embedded outpost's fixed
# `managed: goauthentik.io/outposts/embedded` key.
#
# To protect another app through the proxy later: add its own ProxyProvider
# and Application entries below, then add its !KeyOf to the outpost's
# providers list. That list is authoritative, not additive.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  # Keeping the original key name (flux.yaml) even though this now covers
  # more than flux - renaming it would orphan the existing BlueprintInstance
  # record in Authentik's DB (still pointing at the old mounted path).
  flux.yaml: |
    version: 1
    metadata:
      name: Proxy providers for protected apps
    entries:
      - model: authentik_flows.flow
        id: default-authentication-flow
        identifiers:
          slug: default-authentication-flow
      - model: authentik_flows.flow
        id: default-authorization-flow
        identifiers:
          slug: default-provider-authorization-implicit-consent
      - model: authentik_flows.flow
        id: default-invalidation-flow
        identifiers:
          slug: default-provider-invalidation-flow
      - model: authentik_providers_proxy.proxyprovider
        id: flux-proxy-provider
        identifiers:
          name: flux-proxy
        attrs:
          authentication_flow: !KeyOf default-authentication-flow
          authorization_flow: !KeyOf default-authorization-flow
          invalidation_flow: !KeyOf default-invalidation-flow
          mode: proxy
          external_host: https://flux.jenya.lol
          internal_host: http://flux-operator.flux-system.svc.cluster.local:9080
          internal_host_ssl_validation: false
      - model: authentik_core.application
        id: flux-application
        identifiers:
          slug: flux
        attrs:
          name: Flux
          provider: !KeyOf flux-proxy-provider
      - model: authentik_providers_proxy.proxyprovider
        id: grafana-proxy-provider
        identifiers:
          name: grafana-proxy
        attrs:
          authentication_flow: !KeyOf default-authentication-flow
          authorization_flow: !KeyOf default-authorization-flow
          invalidation_flow: !KeyOf default-invalidation-flow
          mode: proxy
          external_host: https://grafana.jenya.lol
          internal_host: http://kube-prometheus-stack-grafana.observability.svc.cluster.local:80
          internal_host_ssl_validation: false
      - model: authentik_core.application
        id: grafana-application
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf grafana-proxy-provider
      - model: authentik_providers_oauth2.oauth2provider
        id: jellyfin-oidc-provider
        identifiers:
          name: jellyfin-oidc
        attrs:
          redirect_uris:
            - matching_mode: strict
              url: https://jelly.jenya.lol/sso/OIDC/Callback/authentik
              redirect_uri_type: authorization
      - model: authentik_core.application
        id: jellyfin-application
        identifiers:
          slug: jellyfin
        attrs:
          name: Jellyfin
          provider: !KeyOf jellyfin-oidc-provider
      - model: authentik_providers_proxy.proxyprovider
        id: seerr-proxy-provider
        identifiers:
          name: seerr-proxy
        attrs:
          authentication_flow: !KeyOf default-authentication-flow
          authorization_flow: !KeyOf default-authorization-flow
          invalidation_flow: !KeyOf default-invalidation-flow
          mode: proxy
          external_host: https://seerr.jenya.lol
          internal_host: http://seerr.default.svc.cluster.local:5055
          internal_host_ssl_validation: false
      - model: authentik_core.application
        id: seerr-application
        identifiers:
          slug: seerr
        attrs:
          name: Seerr
          provider: !KeyOf seerr-proxy-provider
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf seerr-application
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, jellyfin-users]]
      - model: authentik_outposts.outpost
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          providers:
            - !KeyOf flux-proxy-provider
            - !KeyOf grafana-proxy-provider
            - !KeyOf seerr-proxy-provider
