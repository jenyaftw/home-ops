# Same hostname on both Gateways: true split-horizon. The external-dns-pihole
# instance (scoped to the internal Gateway) creates the Pihole record for
# podinfo.jenya.lol automatically. The public side is covered by
# cloudflare-ddns's wildcard record - the Cloudflare-targeting external-dns
# instance only manages resources labeled external-dns.io/enabled=true,
# which this route deliberately does not have.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
  namespace: podinfo
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
    - name: external
      namespace: kube-system
  hostnames:
    - podinfo.jenya.lol
  rules:
    - backendRefs:
        - name: podinfo
          port: 9898
