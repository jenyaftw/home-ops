# Same hostname on both Gateways: true split-horizon. external-dns-pihole
# (scoped to the internal Gateway) creates the Pihole record automatically.
# external-dns.io/enabled opts this into the Cloudflare instance too, which
# creates a CNAME onto jenya.lol (via the external Gateway's target
# annotation) instead of publishing a private IP.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
  namespace: podinfo
  labels:
    external-dns.io/enabled: "true"
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
    - name: external
      namespace: kube-system
  hostnames:
    - podinfo.jenya.lol
  rules:
    - backendRefs:
        - name: podinfo
          port: 9898
