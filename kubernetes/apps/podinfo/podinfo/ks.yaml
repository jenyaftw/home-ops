apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
  namespace: flux-system
spec:
  targetNamespace: podinfo
  path: ./kubernetes/apps/podinfo/podinfo/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: gateway
      namespace: flux-system
