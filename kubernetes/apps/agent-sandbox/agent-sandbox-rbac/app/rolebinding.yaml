---
# Grants the agent-canvas ServiceAccount admin rights (create/update/delete on
# almost everything) *only* inside this namespace. No access anywhere else in
# the cluster, including agent-canvas's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-canvas-admin
subjects:
  - kind: ServiceAccount
    name: agent-canvas
    namespace: agent-canvas
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
