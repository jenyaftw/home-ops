---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-sandbox-rbac
spec:
  interval: 1h
  path: ./kubernetes/apps/agent-sandbox/agent-sandbox-rbac/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: agent-sandbox
  wait: false
