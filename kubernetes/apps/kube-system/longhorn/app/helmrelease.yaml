# Dedicated 192GiB disk per node (see infra/talos.tf UserVolumeConfig
# "longhorn", mounted at /var/mnt/longhorn), fully reserved for Longhorn -
# not shared with Talos's own system volumes - so only a small reserve is
# needed as headroom, not the 30% default meant for shared disks.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: "1.12.x"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    defaultSettings:
      defaultDataPath: /var/mnt/longhorn
      storageReservedPercentageForDefaultDisk: 10
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 3
