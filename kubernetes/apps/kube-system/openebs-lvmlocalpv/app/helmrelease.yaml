# The "openebs" LVM volume group is created declaratively by Talos itself
# (infra/talos.tf LVMVolumeGroupConfig) on each node's dedicated ~100GB
# disk. This driver only provisions logical volumes within it - it doesn't
# create the VG.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs-lvmlocalpv
  namespace: openebs
spec:
  interval: 1h
  chart:
    spec:
      chart: lvm-localpv
      version: "1.10.x"
      sourceRef:
        kind: HelmRepository
        name: openebs-lvmlocalpv
        namespace: openebs
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
