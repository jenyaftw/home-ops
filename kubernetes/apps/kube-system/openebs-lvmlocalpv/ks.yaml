apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openebs-lvmlocalpv
  namespace: flux-system
spec:
  targetNamespace: openebs
  path: ./kubernetes/apps/kube-system/openebs-lvmlocalpv/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
