# Exposes Flux's webhook receiver publicly so a GitHub webhook can trigger
# immediate reconciliation instead of waiting for the poll interval.
# Covered by the cloudflare-ddns wildcard record - excluded from external-dns.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook
  namespace: flux-system
  annotations:
    external-dns.kubernetes.io/controller: ignore
spec:
  parentRefs:
    - name: external
      namespace: kube-system
  hostnames:
    - flux-webhook.jenya.lol
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hook/
      backendRefs:
        - name: webhook-receiver
          port: 80
