# Exposes Flux's webhook receiver publicly so a GitHub webhook can trigger
# immediate reconciliation instead of waiting for the poll interval.
# Only attaches to the external Gateway, so external-dns-pihole (scoped to
# the internal Gateway) never sees it; covered by the cloudflare-ddns
# wildcard record, so the Cloudflare instance (opt-in via label) ignores it
# too.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  parentRefs:
    - name: external
      namespace: kube-system
  hostnames:
    - flux-webhook.jenya.lol
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hook/
      backendRefs:
        - name: webhook-receiver
          port: 80
