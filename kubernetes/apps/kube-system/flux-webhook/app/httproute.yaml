# Exposes Flux's webhook receiver publicly so a GitHub webhook can trigger
# immediate reconciliation instead of waiting for the poll interval.
# Only attaches to the external Gateway. cloudflare-ddns only manages the
# bare apex (jenya.lol) - there's no wildcard record, so this needs its
# own external-dns-published CNAME like any other public app.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook
  namespace: flux-system
  labels:
    external-dns.io/enabled: "true"
spec:
  parentRefs:
    - name: external
      namespace: kube-system
  hostnames:
    - flux-webhook.jenya.lol
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hook/
      backendRefs:
        - name: webhook-receiver
          port: 80
