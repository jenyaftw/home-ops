apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  targetNamespace: flux-system
  path: ./kubernetes/apps/kube-system/flux-webhook/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: gateway
      namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
