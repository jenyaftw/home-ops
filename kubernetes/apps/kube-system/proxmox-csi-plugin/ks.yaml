apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: proxmox-csi-plugin
  namespace: flux-system
spec:
  targetNamespace: csi-proxmox
  path: ./kubernetes/apps/kube-system/proxmox-csi-plugin/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
