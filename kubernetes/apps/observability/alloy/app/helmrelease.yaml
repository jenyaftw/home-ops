# References the "grafana" HelmRepository created by the loki app (this
# Kustomization depends on loki, so it always exists by the time this
# reconciles) - avoids two Kustomizations both owning/pruning the same
# HelmRepository object.
#
# loki.source.kubernetes tails pod logs directly via the Kubernetes API
# (pods/log subresource) - no /var/log/pods hostPath mount needed.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: observability
spec:
  interval: 1h
  releaseName: alloy
  chart:
    spec:
      chart: alloy
      version: "1.12.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: observability
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      type: daemonset

    alloy:
      configMap:
        create: true
        content: |
          discovery.kubernetes "pods" {
            role = "pod"
          }

          loki.source.kubernetes "pods" {
            targets    = discovery.kubernetes.pods.targets
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
            }
          }

      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 200Mi
