# Shared namespace for the observability stack (Prometheus/Grafana, Loki,
# Alloy) consumed by multiple apps. Privileged PSA labels needed for
# node-exporter (hostNetwork/hostPID/hostPath to read host-level metrics).
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
