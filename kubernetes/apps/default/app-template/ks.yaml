apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-template
  namespace: flux-system
spec:
  targetNamespace: default
  path: ./kubernetes/apps/default/app-template/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
