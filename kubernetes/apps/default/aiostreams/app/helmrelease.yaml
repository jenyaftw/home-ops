apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aiostreams
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/viren070/aiostreams
              tag: v2.35.9
            env:
              TZ: Etc/UTC
              PORT: "3000"
              BASE_URL: https://aiostreams.jenya.lol
              LOG_FORMAT: json
              # Pinned here so the dashboard can't switch the public config page open.
              AIOSTREAMS_AUTH_REQUIRED: "true"
            envFrom:
              - secretRef:
                  name: aiostreams-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
              readiness: *probe
              # Port 3000 only opens after the anime databases finish their
              # initial download, which outlasts the default liveness budget.
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: 3000

    route:
      main:
        hostnames:
          - aiostreams.jenya.lol
        parentRefs:
          - name: internal
            namespace: kube-system
          - name: external
            namespace: kube-system
        labels:
          external-dns.io/enabled: "true"
        rules:
          - backendRefs:
              - identifier: main
                port: 3000

    # Config lives in Postgres; this is only the disk cache (DISK_CACHE_DIR
    # defaults under the data dir), so it doesn't need to survive restarts.
    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /app/data
