apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
  namespace: default
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        strategy: Recreate
        initContainers:
          configure:
            image:
              repository: busybox
              tag: "1.37"
            command:
              - /bin/sh
              - -ec
              - |
                config=/config/sabnzbd.ini
                hosts='sabnzbd.jenya.lol, sabnzbd, sabnzbd.default.svc.cluster.local'
                if [ -f "$config" ]; then
                  sed -i "s/^host_whitelist =.*/host_whitelist = $hosts/" "$config"
                  sed -i 's|^download_dir =.*|download_dir = /media/usenet/incomplete|' "$config"
                  sed -i 's|^complete_dir =.*|complete_dir = /media/usenet/complete|' "$config"
                else
                  printf '[misc]\nhost_whitelist = %s\ndownload_dir = /media/usenet/incomplete\ncomplete_dir = /media/usenet/complete\n' "$hosts" > "$config"
                fi
                umask 077
                # Flux decrypts the mounted NNTP Secret before this pod starts.
                block=/tmp/torbox-server
                {
                  printf '[[TorBox]]\nname = TorBox\ndisplayname = TorBox\nhost = nntp.torbox.app\nport = 563\nssl = 1\nssl_verify = 2\nconnections = 10\nenable = 1\npriority = 0\nusername = '
                  cat /run/secrets/nntp/username
                  printf '\npassword = '
                  cat /run/secrets/nntp/password
                  printf '\n'
                } > "$block"
                awk -v block="$block" '
                  /^\[servers\]$/ {
                    print
                    while ((getline line < block) > 0) print line
                    close(block)
                    found = 1
                    next
                  }
                  /^\[\[TorBox\]\]$/ { skip = 1; next }
                  skip && /^\[/ { skip = 0 }
                  !skip { print }
                  END {
                    if (!found) {
                      print "[servers]"
                      while ((getline line < block) > 0) print line
                      close(block)
                    }
                  }
                ' "$config" > "${config}.new"
                cat "${config}.new" > "$config"
                : > "${config}.new"
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/sabnzbd
              tag: latest
            env:
              TZ: Etc/UTC
              PUID: "1000"
              PGID: "1000"
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: 8080

    route:
      main:
        kind: HTTPRoute
        hostnames:
          - sabnzbd.jenya.lol
        parentRefs:
          - name: internal
            namespace: kube-system
        rules:
          - backendRefs:
              - identifier: main
                port: 8080

    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /config
      media:
        type: nfs
        server: 10.0.10.20
        path: /media
        globalMounts:
          - path: /media
      nntp:
        type: secret
        name: sabnzbd-nntp
        advancedMounts:
          main:
            configure:
              - path: /run/secrets/nntp
                readOnly: true
