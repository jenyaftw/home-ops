apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
  namespace: default
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        strategy: Recreate
        initContainers:
          allow-hostnames:
            image:
              repository: busybox
              tag: "1.37"
            command:
              - /bin/sh
              - -ec
              - |
                config=/config/sabnzbd.ini
                hosts='sabnzbd.jenya.lol, sabnzbd, sabnzbd.default.svc.cluster.local'
                if [ -f "$config" ]; then
                  sed -i "s/^host_whitelist =.*/host_whitelist = $hosts/" "$config"
                else
                  printf '[misc]\nhost_whitelist = %s\n' "$hosts" > "$config"
                fi
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/sabnzbd
              tag: latest
            env:
              TZ: Etc/UTC
              PUID: "1000"
              PGID: "1000"
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: 8080

    route:
      main:
        kind: HTTPRoute
        hostnames:
          - sabnzbd.jenya.lol
        parentRefs:
          - name: internal
            namespace: kube-system
        rules:
          - backendRefs:
              - identifier: main
                port: 8080

    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /config
      media:
        type: nfs
        server: 10.0.10.20
        path: /media
        globalMounts:
          - path: /media
