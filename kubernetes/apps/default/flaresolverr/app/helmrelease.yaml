# Proxy that solves Cloudflare/DDoS-Guard challenges on behalf of
# indexers that need it. Added as an Indexer Proxy in Radarr/Sonarr
# (and Prowlarr) - internal-only, nothing else needs to reach it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: latest
            env:
              TZ: Etc/UTC
              LOG_LEVEL: info
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: 8191
