# Proxy that solves Cloudflare/DDoS-Guard challenges on behalf of
# indexers that need it. Added as an Indexer Proxy in Radarr/Sonarr
# (and Prowlarr) - internal-only, nothing else needs to reach it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: latest
            env:
              TZ: Etc/UTC
              LOG_LEVEL: info
            # Each Cloudflare challenge-solve runs a real headless Chromium
            # instance for ~10-12s. Observed 767Mi used from a handful of
            # sequential test requests alone - a 1Gi limit gets OOMKilled
            # under concurrent solves (Prowlarr searches indexers in
            # parallel), causing intermittent failures.
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 3Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: 8191
