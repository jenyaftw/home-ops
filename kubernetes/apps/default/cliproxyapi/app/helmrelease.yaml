apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cliproxyapi
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        strategy: Recreate
        initContainers:
          # The server rewrites config.yaml itself (hashes the management
          # key on first start, persists edits made in the web UI), so the
          # SOPS secret is only a seed: copied onto the PVC once, never
          # re-applied. Edit config in the UI afterwards, not in git.
          seed-config:
            image:
              repository: busybox
              tag: "1.37"
            command:
              - /bin/sh
              - -ec
              - |
                if [ ! -f /data/config.yaml ]; then
                  cp /seed/config.yaml /data/config.yaml
                fi
                mkdir -p /data/auths
        containers:
          main:
            image:
              repository: eceasy/cli-proxy-api
              tag: v8.0.22
            # The image has no ENTRYPOINT, only CMD, so args alone would
            # replace the binary. Everything lives under /data so the
            # bundled management.html lands in /data/static (always
            # resolved as "static/" beside the config file).
            command:
              - /CLIProxyAPI/CLIProxyAPI
              - --config
              - /data/config.yaml
            env:
              TZ: Etc/UTC
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8317
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      main:
        controller: main
        ports:
          http:
            port: 8317

    # LAN-only: the proxy and its management UI carry OAuth tokens for
    # every subscription. Not behind Authentik because API clients
    # (Claude Code, Codex) authenticate with a bearer key the outpost
    # would intercept; the app enforces its own keys on every route.
    route:
      main:
        hostnames:
          - cliproxy.jenya.lol
        parentRefs:
          - name: internal
            namespace: kube-system
        rules:
          - backendRefs:
              - identifier: main
                port: 8317

    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data
      seed-config:
        type: secret
        name: cliproxyapi-secret
        advancedMounts:
          main:
            seed-config:
              - path: /seed
                readOnly: true
