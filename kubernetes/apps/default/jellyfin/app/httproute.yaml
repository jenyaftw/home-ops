# Same hostname on both Gateways: true split-horizon, same as podinfo.
# Jellyfin handles OIDC itself, so send traffic directly to Jellyfin.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: default
  labels:
    external-dns.io/enabled: "true"
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
    - name: external
      namespace: kube-system
  hostnames:
    - jellyfin.jenya.lol
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      backendRefs:
        - name: jellyfin-entry
          port: 80
    - backendRefs:
        - name: jellyfin
          port: 8096
