# Public, unauthenticated - routed straight to the app, not through
# Authentik's outpost.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whoami
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: traefik/whoami
              tag: v1.11.0
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi

    service:
      main:
        controller: main
        ports:
          http:
            port: 80

    route:
      main:
        kind: HTTPRoute
        hostnames:
          - whoami.jenya.lol
        parentRefs:
          - name: external
            namespace: kube-system
        rules:
          - backendRefs:
              - identifier: main
                port: 80
