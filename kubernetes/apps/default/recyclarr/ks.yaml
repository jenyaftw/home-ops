apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: recyclarr
  namespace: flux-system
spec:
  targetNamespace: default
  path: ./kubernetes/apps/default/recyclarr/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: radarr
      namespace: flux-system
    - name: sonarr
      namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
