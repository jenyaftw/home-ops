# NANA was added as standard TV on the zurg magic mount. Anime search is
# needed for Toloka's Anime (5070) releases; local imports need the NAS root.
apiVersion: batch/v1
kind: Job
metadata:
  name: sonarr-nana-library
  namespace: default
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: configure-series
          image: python:3.13-alpine
          env:
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: recyclarr-secrets
                  key: SONARR_API_KEY
          command:
            - python
            - -c
            - |
              import json
              import os
              import urllib.request

              base = "http://sonarr.default.svc.cluster.local:8989/api/v3/series"
              headers = {"X-Api-Key": os.environ["SONARR_API_KEY"]}
              with urllib.request.urlopen(urllib.request.Request(base, headers=headers), timeout=30) as response:
                  series = json.load(response)

              nana = next((item for item in series if item["tvdbId"] == 80742), None)
              if nana is None:
                  print("NANA is not in Sonarr; nothing to update")
              elif nana["seriesType"] == "anime" and nana["path"] == "/media/tv/NANA":
                  print("NANA already uses anime search and the NAS library")
              else:
                  if nana["statistics"]["episodeFileCount"]:
                      raise RuntimeError("NANA has files; move them before changing its library path")
                  nana["seriesType"] = "anime"
                  nana["rootFolderPath"] = "/media/tv"
                  nana["path"] = "/media/tv/NANA"
                  request = urllib.request.Request(
                      f"{base}/{nana['id']}?moveFiles=false",
                      data=json.dumps(nana).encode(),
                      headers={**headers, "Content-Type": "application/json"},
                      method="PUT",
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      updated = json.load(response)
                  if updated["seriesType"] != "anime" or updated["path"] != "/media/tv/NANA":
                      raise RuntimeError("Sonarr did not save NANA's series settings")
                  print("NANA now uses anime search and the NAS library")
