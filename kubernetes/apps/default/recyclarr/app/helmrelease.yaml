# Syncs TRaSH Guides quality profiles/custom formats into Radarr (movies)
# and Sonarr (TV + a separate anime profile). trash_ids below are pinned
# to specific TRaSH Guides profiles - see the linked docs per profile if
# you want to swap one out. api_key values come from env vars, not the
# ConfigMap, so this file has no secrets in it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    configMaps:
      config:
        data:
          recyclarr.yml: |
            radarr:
              movies:
                base_url: http://radarr.default.svc.cluster.local:7878
                api_key: !env_var RADARR_API_KEY
                quality_definition:
                  type: movie
                quality_profiles:
                  - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
                    reset_unmatched_scores:
                      enabled: true
                custom_format_groups:
                  add:
                    - trash_id: f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD
                    - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats

            sonarr:
              tv:
                base_url: http://sonarr.default.svc.cluster.local:8989
                api_key: !env_var SONARR_API_KEY
                quality_definition:
                  type: series
                quality_profiles:
                  - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
                    reset_unmatched_scores:
                      enabled: true
                custom_format_groups:
                  add:
                    - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
                    - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4  # [Optional] Language Profiles
                    - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
                    - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats

              anime:
                base_url: http://sonarr.default.svc.cluster.local:8989
                api_key: !env_var SONARR_API_KEY
                quality_definition:
                  type: anime
                quality_profiles:
                  - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
                    reset_unmatched_scores:
                      enabled: true

    controllers:
      main:
        type: cronjob
        cronjob:
          schedule: "0 3 * * *"
        containers:
          main:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: "8"
            command:
              - recyclarr
              - sync
            envFrom:
              - secretRef:
                  name: recyclarr-secrets
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 256Mi

    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config/recyclarr.yml
            subPath: recyclarr.yml
            readOnly: true
