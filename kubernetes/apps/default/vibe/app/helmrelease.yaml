apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vibe
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000

    serviceAccount:
      vibe: {}

    rbac:
      roles:
        vibe:
          type: Role
          rules:
            - apiGroups: [""]
              resources: [pods, pods/log, secrets, persistentvolumeclaims]
              verbs: [get, list, watch, create, delete]
      bindings:
        vibe:
          type: RoleBinding
          roleRef:
            identifier: vibe
          subjects:
            - identifier: vibe

    controllers:
      main:
        strategy: Recreate
        serviceAccount:
          identifier: vibe
        containers:
          main:
            image:
              repository: ghcr.io/jenyaftw/vibe-server
              tag: 0.5.5
            env:
              TZ: Europe/Kiev
              VIBE_RUNNER: k8s
              VIBE_NAMESPACE: default
              VIBE_WORKER_IMAGE: ghcr.io/jenyaftw/vibe-worker:0.5.5
              VIBE_WORKER_MEMORY: 6Gi
              VIBE_ORCHESTRATOR_URL: http://vibe.default.svc.cluster.local:8080
              VIBE_PUBLIC_URL: https://vibe.jenya.lol
              VIBE_WORKER_ENV_SECRET: vibe-worker-env
              VIBE_STORAGE_CLASS: proxmox-lvm
              VIBE_IMAGE_PULL_SECRET: ghcr-pull-secret
              VIBE_POD_HOST_ALIASES: 10.0.10.200=cliproxy.jenya.lol
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: vibe-postgres-credentials
                    key: password
              DATABASE_URL:
                value: postgres://vibe:$(DB_PASSWORD)@postgres-rw.database.svc.cluster.local:5432/vibe
                dependsOn: DB_PASSWORD
            envFrom:
              - secretRef:
                  name: vibe-secret
              - secretRef:
                  name: vibe-worker-env
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 5
                  timeoutSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: 8080

    route:
      main:
        hostnames:
          - vibe.jenya.lol
        parentRefs:
          - name: internal
            namespace: kube-system
        rules:
          - backendRefs:
              - identifier: main
                port: 8080
