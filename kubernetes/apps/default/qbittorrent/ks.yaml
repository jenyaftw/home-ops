apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qbittorrent
  namespace: flux-system
spec:
  targetNamespace: default
  path: ./kubernetes/apps/default/qbittorrent/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  # HelmRelease reports rollout health; let Flux apply fixes while a pod is pending.
  wait: false
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  dependsOn:
    - name: app-template
      namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
