apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qa-picker
  namespace: flux-system
spec:
  # No targetNamespace: the app lives in default, but its Database and
  # DatabaseRole must live alongside the shared Cluster in database.
  path: ./kubernetes/apps/default/qa-picker/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  dependsOn:
    - name: postgres
      namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
