# The dashboard and API, LAN only; sign-in is Entra ID. One Service serves both. What Azure DevOps and Slack call
# from the internet is on httproute-hooks.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qa-picker
  namespace: default
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
  hostnames:
    - qa-picker.jenya.lol
  rules:
    - backendRefs:
        - name: qa-picker
          port: 8000
