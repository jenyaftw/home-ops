# qa-picker's own Redis (job queue, rate limits), so it needs no credentials of the shared one in database.
# Not durable storage: queued jobs are recreated by the next sync.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qa-picker-redis
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qa-picker-redis
  template:
    metadata:
      labels:
        app: qa-picker-redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - noeviction
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qa-picker-redis-credentials
                  key: password
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qa-picker-redis
  namespace: default
spec:
  selector:
    app: qa-picker-redis
  ports:
    - port: 6379
      targetPort: 6379
