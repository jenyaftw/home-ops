apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qa-picker
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: qa-picker
    namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: qa-picker
    imagePullSecrets:
      - name: ghcr-pull-secret
    # DATABASE_URL, REDIS_URL, APP_SECRET_KEY, ADO_PAT, the ADO webhook credentials and the Slack/OpenAI secrets.
    secrets:
      existingSecret: qa-picker-secrets
    config:
      TZ: Europe/Kiev
      PUBLIC_BASE_URL: https://qa-picker.jenya.lol
      CORS_ORIGINS: https://qa-picker.jenya.lol
      # Entra app registrations in the meetwonka tenant: qa-picker-api (exposes access_as_user and the
      # QaPicker.Admin/Viewer roles) and qa-picker-web (the SPA, redirect https://qa-picker.jenya.lol).
      AUTH_MODE: entra
      ENTRA_TENANT_ID: 0b316ab4-c894-4abb-874a-3bbdc627273f
      ENTRA_CLIENT_ID: 87b2425c-3155-4f64-8e43-e4278c8edd11
      ENTRA_API_AUDIENCE: api://e15ddae9-6bd3-4ebf-ab67-4a05a1353477
      ENTRA_API_SCOPE: api://e15ddae9-6bd3-4ebf-ab67-4a05a1353477/access_as_user
      RBAC_ADMIN_EMAILS: jenya@meetwonka.com
      ADO_ORG_URL: https://dev.azure.com/meetwonka
      ADO_AUTH_TYPE: pat
      # The qa-picker Slack app (manifest: qa-picker's slack/manifest.yaml, interactivity on qa-picker-hooks.jenya.lol).
      SLACK_CLIENT_ID: "9724711904785.12349872604706"
    api:
      replicas: 1
    web:
      replicas: 1
