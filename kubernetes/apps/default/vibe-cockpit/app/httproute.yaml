# Routed through Authentik's embedded outpost (Proxy Provider "cockpit-proxy" in
# kubernetes/apps/authentik/authentik/app/blueprint.yaml). The outpost checks auth, then proxies to the cockpit via its
# internal_host. Internal gateway only: the cockpit holds the vibe admin token.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vibe-cockpit
  namespace: default
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
  hostnames:
    - cockpit.jenya.lol
  rules:
    - backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
