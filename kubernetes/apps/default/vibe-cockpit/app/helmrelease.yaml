# The vibe board + chat in a browser terminal (`vibe cockpit-serve`: xterm.js + tmux) at https://cockpit.jenya.lol, behind Authentik (see
# httproute.yaml and the cockpit-proxy blueprint). Several people: Authentik authenticates and sends the signed-in user in
# X-authentik-username, the cockpit trusts that header, and every person gets their own account, token and tmux server. The pod holds no
# admin token, only VIBE_COCKPIT_SECRET (the same value as on the vibe orchestrator); networkpolicy.yaml lets only Authentik's
# outpost reach the pod, which is what makes trusting the header safe.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vibe-cockpit
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000

    controllers:
      main:
        # One pod holds the tmux session; never run two.
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/jenyaftw/vibe-cockpit
              tag: 0.6.11
            env:
              TZ: Europe/Kiev
              VIBE_URL: http://vibe.default.svc.cluster.local:8080
              # Authentik's proxy provider sends the signed-in user in this header; the cockpit refuses a connection without it.
              COCKPIT_USER_HEADER: X-authentik-username
            envFrom:
              # VIBE_COCKPIT_SECRET only (not the admin token): lets the cockpit create users and mint their tokens, nothing else.
              - secretRef:
                  name: vibe-cockpit-secret
            probes:
              # /healthz answers without the user header; every other path needs it.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 7681
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              # Each person adds a board, a chat relay and one process per open task window: roughly 200-400 MB.
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      data:
        type: emptyDir
        globalMounts:
          - path: /data

    service:
      main:
        controller: main
        ports:
          http:
            port: 7681
