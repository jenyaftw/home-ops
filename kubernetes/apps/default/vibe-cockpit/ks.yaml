apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vibe-cockpit
  namespace: flux-system
spec:
  targetNamespace: default
  path: ./kubernetes/apps/default/vibe-cockpit/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: app-template
      namespace: flux-system
    - name: vibe
      namespace: flux-system
