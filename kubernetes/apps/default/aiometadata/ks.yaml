apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aiometadata
  namespace: flux-system
spec:
  # The app and its credentials live in default; its Database and
  # DatabaseRole must live alongside the shared Cluster in database.
  path: ./kubernetes/apps/default/aiometadata/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  dependsOn:
    - name: app-template
      namespace: flux-system
    - name: postgres
      namespace: flux-system
    - name: redis
      namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
