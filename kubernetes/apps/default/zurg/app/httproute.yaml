# zurg has no real dashboard - this just exposes its browsable HTTP/
# WebDAV directory listing so the library can be checked in a browser.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zurg
  namespace: default
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
  hostnames:
    - zurg.jenya.lol
  rules:
    - backendRefs:
        - name: zurg
          port: 9999
