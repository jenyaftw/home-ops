# Dashboard lives at /config/ (torrent management, tags, IMDB IDs,
# etc.) - a nightly-only feature.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zurg
  namespace: default
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
  hostnames:
    - zurg.jenya.lol
  rules:
    - backendRefs:
        - name: zurg
          port: 9999
