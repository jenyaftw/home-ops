# Presents the TorBox library as WebDAV (mounted by radarr/sonarr's
# rclone sidecars) and, on the same port under /api/v2, a qBittorrent-
# compatible API added as a Download Client directly in radarr/sonarr -
# see config.yml's magic/qbittorrent blocks.
#
# The magic/qbittorrent feature only exists in zurg's nightly builds,
# which are gated behind an active Patreon/GitHub Sponsors subscription
# tied to a GitHub account. Mirrored the nightly image we have access to
# into a private image under our own account (ghcr.io/jenyaftw/
# zurg-nightly) instead of depending on continued sponsorship for the
# image to keep pulling - see pullsecret.sops.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zurg
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        pod:
          imagePullSecrets:
            - name: ghcr-pull-secret
        containers:
          main:
            image:
              repository: ghcr.io/jenyaftw/zurg-nightly
              tag: latest
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      main:
        controller: main
        ports:
          http:
            port: 9999

    persistence:
      config:
        type: secret
        name: zurg-config
        globalMounts:
          - path: /app/config.yml
            subPath: config.yml
            readOnly: true
      data:
        type: persistentVolumeClaim
        storageClass: proxmox-lvm
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /app/data
